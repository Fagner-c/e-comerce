<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="style/estilo.css">
    <title>CID-Distributio</title>
</head>
<body>
    <header>
        <div class="header_principal">
            <div class="logo">
                <a href="index.html">Distributio</a>
            </div>
            <div class="pesquisa">
                <input id="searchInput" type="search" placeholder="Buscar produtos...">
                <button id="searchBtn">🔎</button>
            </div>
            <div class="carrinho">
                <a href="#">🛒 Carrinho <button class="compra">0</button></a>
            </div>
        </div>
        <div class="header_secundario">
            <nav>
                <button id="btn-todos">Todos</button>
                <button id="btn-rp">Roupas</button>
                <button id="btn-el">Eletrônios</button>
                <button id="btn-ac">Acessorios</button>
                <button id="btn-cl">Calçados</button>
            </nav>
        </div>
    </header>
    <main>
        <section class="card-desconto">
            <div class="texto_desconto">
                <h2>OFERTAS DO DIA</h2>
                <h3>
                    Encontre produtos incríveis pelo melhor preço.
                </h3>
                <p>Uma experiencia de compra simples, rápida e moderna</p>
                <a href="#">Ver produtos</a>
            </div>
            <div class="icon">🛍️</div>
            </div>
        </section>
        <section class="produtos-todos" id="produtos-todos">
        </section>
    </main>
    <script type="module" src="script/main.js" defer></script>
</body>
</html>
